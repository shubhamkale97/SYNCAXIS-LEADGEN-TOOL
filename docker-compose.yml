services:
  google-maps-scraper:
    # v1.15.0 references a removed Playwright driver download. v1.18.1 bundles
    # its matching browser and driver under /opt/ms-playwright-go.
    image: gosom/google-maps-scraper:v1.18.1
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    volumes:
      - gmaps_data:/gmapsdata

  web:
    build: .
    restart: unless-stopped
    environment:
      SCRAPER_BASE_URL: http://google-maps-scraper:8080
      PORT: "3000"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      JOB_SOURCES: ${JOB_SOURCES:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-in}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      LINKEDIN_DELAY: ${LINKEDIN_DELAY:-3.5}
      LINKEDIN_PAGES: ${LINKEDIN_PAGES:-3}
      LINKEDIN_PROXY: ${LINKEDIN_PROXY:-}
      JOBSPY_SITES: ${JOBSPY_SITES:-linkedin,indeed,glassdoor,google,naukri}
      JOBSPY_COUNTRY: ${JOBSPY_COUNTRY:-india}
      ATS_PROVIDERS: ${ATS_PROVIDERS:-greenhouse,lever,ashby}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      # Keep localhost as the safe default. Set HOST_BIND to the machine's LAN
      # address (for example 192.168.3.9) to make the UI reachable on the LAN.
      - "${HOST_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - leadgen_meta:/var/lib/leadgen
    depends_on:
      - google-maps-scraper

volumes:
  gmaps_data:
  leadgen_meta:
