services:
  google-maps-scraper:
    # v1.15.0 references a removed Playwright driver download. v1.18.1 bundles
    # its matching browser and driver under /opt/ms-playwright-go.
    image: gosom/google-maps-scraper:v1.18.1
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    volumes:
      - gmaps_data:/gmapsdata

  web:
    build: .
    restart: unless-stopped
    environment:
      SCRAPER_BASE_URL: http://google-maps-scraper:8080
      PORT: "3000"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      HERE_API_KEY: ${HERE_API_KEY:-}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      NOMINATIM_CONTACT: ${NOMINATIM_CONTACT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JOBS_CACHE_TTL: ${JOBS_CACHE_TTL:-21600}
      BROWSER_MAX_CONCURRENCY: ${BROWSER_MAX_CONCURRENCY:-1}
      BROWSER_QUEUE_TIMEOUT: ${BROWSER_QUEUE_TIMEOUT:-120}
      MAP_PROVIDER: ${MAP_PROVIDER:-here}
      JOB_SOURCES: ${JOB_SOURCES:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-in}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      LINKEDIN_DELAY: ${LINKEDIN_DELAY:-3.5}
      LINKEDIN_PAGES: ${LINKEDIN_PAGES:-3}
      LINKEDIN_PROXY: ${LINKEDIN_PROXY:-}
      JOBSPY_SITES: ${JOBSPY_SITES:-linkedin,indeed,glassdoor,google,naukri}
      JOBSPY_COUNTRY: ${JOBSPY_COUNTRY:-india}
      ATS_PROVIDERS: ${ATS_PROVIDERS:-greenhouse,lever,ashby}
      LINKEDIN_ENGINE: ${LINKEDIN_ENGINE:-playwright}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-30000}
      IMPERSONATE_BROWSER: ${IMPERSONATE_BROWSER:-chrome}
      HTTP_ATTEMPTS: ${HTTP_ATTEMPTS:-3}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      # Keep localhost as the safe default. Set HOST_BIND to the machine's LAN
      # address (for example 192.168.3.9) to make the UI reachable on the LAN.
      - "${HOST_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - leadgen_meta:/var/lib/leadgen
    depends_on:
      - google-maps-scraper
    # The app runs as an unprivileged user (see Dockerfile); also drop every
    # Linux capability, block privilege escalation, and cap memory/processes so
    # one runaway search (e.g. Chromium) cannot take the host down.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${WEB_MEM_LIMIT:-2g}
    pids_limit: 512

volumes:
  gmaps_data:
  leadgen_meta:
